services:
  workhub:
    build:
      context: .
      dockerfile: Dockerfile
    image: workhub:4.1.0
    container_name: workhub
    restart: unless-stopped
    env_file:
      - .env.nas
    network_mode: host
    volumes:
      - workhub-data:/data
      - /volume1/docker/workhub/migration:/migration:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1536m

volumes:
  workhub-data:
    name: workhub-data
